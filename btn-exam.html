<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --mt: 0px;   /* Отступ сверху: чем меньше, тем ближе к верху */
            --mb: 0px;   /* Отступ снизу */
            --ml: 10px;  /* Отступ слева: добавь значение, чтобы сделать свободнее */
            --mr: 10px;  /* Отступ справа */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .container-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding-top: var(--mt);
            padding-bottom: var(--mb);
            padding-left: var(--ml);
            padding-right: var(--mr);
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.4)); }
            50% { filter: drop-shadow(0 0 25px rgba(99, 102, 241, 0.85)); }
        }
        .glow-hover:hover { animation: pulse-glow 2.5s infinite; }
    </style>
</head>
<body class="p-0 m-0 bg-transparent overflow-hidden">

    <div class="container-box">
        <button id="examBtn" 
                class="glow-hover group relative block w-full border-0 p-0 m-0 bg-transparent outline-none cursor-pointer transition-all duration-300 ease-in-out transform hover:scale-[1.01] hover:brightness-105"
                onclick="openExam()">
            
            <img src="https://raw.githubusercontent.com/ogaydv-prog/Simulator-NPV/main/pic-exam-final.png" 
                 alt="Экзамен" 
                 class="w-full h-auto block border-0">
        </button>
    </div>

    <script>
        const examDashboardUrl = "exam-dashbord-pro-f.html";
        function openExam() { window.open(examDashboardUrl, '_blank'); }
    </script>
</body>
</html>
