<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Анимация мягкого пульсирующего свечения при наведении */
        @keyframes pulse-glow {
            0%, 100% { 
                box-shadow: 0 0 15px rgba(99, 102, 241, 0.3), inset 0 0 10px rgba(99, 102, 241, 0.2); 
            }
            50% { 
                box-shadow: 0 0 30px rgba(99, 102, 241, 0.75), inset 0 0 15px rgba(99, 102, 241, 0.4); 
            }
        }
        .glow-hover:hover {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center p-6 bg-transparent overflow-hidden">

    <button id="examBtn" 
            class="glow-hover group relative flex items-center justify-center transition-all duration-300 ease-in-out transform hover:scale-105 hover:shadow-2xl rounded-[2rem] p-3 bg-slate-950/80 border-4 border-indigo-500/20 hover:border-indigo-500 overflow-hidden cursor-pointer"
            onclick="openExam()">
        
        <!-- Обновленное финальное изображение из GitHub -->
        <img src="https://raw.githubusercontent.com/ogaydv-prog/Simulator-NPV/main/pic-exam-final.png" 
             alt="Экзамен" 
             class="w-48 h-48 object-cover transition-all duration-300 group-hover:scale-102 rounded-[1.5rem]">
        
        <!-- Световой оверлей -->
        <div class="absolute inset-0 bg-gradient-to-tr from-indigo-500/10 to-purple-500/10 opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity duration-300"></div>
    </button>

    <script>
        const examDashboardUrl = "exam-dashbord-pro-f.html";

        function openExam() {
            // Мгновенное и надежное открытие дашборда в новой вкладке
            window.open(examDashboardUrl, '_blank');
        }
    </script>
</body>
</html>
