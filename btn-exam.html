<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Мягкое контурное свечение вокруг самого изображения при наведении */
        @keyframes pulse-glow {
            0%, 100% { 
                filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.4));
            }
            50% { 
                filter: drop-shadow(0 0 25px rgba(99, 102, 241, 0.85));
            }
        }
        .glow-hover:hover {
            animation: pulse-glow 2.5s infinite;
        }
    </style>
</head>
<body class="p-0 m-0 bg-transparent overflow-hidden w-full">

    <button id="examBtn" 
            class="glow-hover group relative block w-full border-0 p-0 m-0 bg-transparent outline-none cursor-pointer transition-all duration-300 ease-in-out transform hover:scale-[1.015] hover:brightness-105"
            onclick="openExam()">
        
        <!-- Изображение растягивается на всю ширину контейнера Sites -->
        <img src="https://raw.githubusercontent.com/ogaydv-prog/Simulator-NPV/main/pic-exam-final.png" 
             alt="Экзамен" 
             class="w-full h-auto block rounded-2xl">
        
    </button>

    <script>
        const examDashboardUrl = "exam-dashbord-pro-f.html";

        function openExam() {
            window.open(examDashboardUrl, '_blank');
        }
    </script>
</body>
</html>
