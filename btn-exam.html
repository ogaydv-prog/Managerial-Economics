<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Анимация пульсации без лишних отступов */
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.4)); }
            50% { filter: drop-shadow(0 0 25px rgba(99, 102, 241, 0.85)); }
        }
        .glow-hover:hover { animation: pulse-glow 2.5s infinite; }
        
        /* Убираем любые возможные отступы у самой кнопки */
        button { display: block; width: 100%; margin: 0 !important; padding: 0 !important; line-height: 0; }
    </style>
</head>
<body class="p-0 m-0 bg-transparent overflow-hidden w-full h-full">

    <button id="examBtn" 
            class="glow-hover group relative block w-full border-0 p-0 m-0 bg-transparent outline-none cursor-pointer transition-all duration-300 ease-in-out transform hover:scale-[1.01] hover:brightness-105"
            onclick="openExam()">
        
        <img src="https://raw.githubusercontent.com/ogaydv-prog/Simulator-NPV/main/pic-exam-final.png" 
             alt="Экзамен" 
             class="w-full h-auto block border-0 m-0 p-0">
        
    </button>

    <script>
        const examDashboardUrl = "exam-dashbord-pro-f.html";

        function openExam() {
            window.open(examDashboardUrl, '_blank');
        }
    </script>
</body>
</html>
