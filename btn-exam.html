<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Сбрасываем всё, чтобы ничего не обрезало */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }

        #examBtn {
            width: 100%;
            height: 100%;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            /* Убрали overflow: hidden, чтобы ничего не подрезалось */
        }

        #examBtn img {
            width: 100%;
            height: 100%;
            /* object-fit: contain гарантирует, что вся картинка 
               влезет в рамку без обрезки сторон */
            object-fit: contain;
            display: block;
            transition: transform 0.2s ease;
        }

        /* Только простое увеличение без всяких теней и полосок */
        #examBtn:hover img {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <button id="examBtn" onclick="window.open('exam-dashbord-pro-f.html', '_blank')">
        <img src="https://raw.githubusercontent.com/ogaydv-prog/Simulator-NPV/main/pic-exam-final.png" alt="Экзамен">
    </button>

</body>
</html>
