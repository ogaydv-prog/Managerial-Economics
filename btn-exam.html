<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        /* Обнуляем абсолютно все отступы и скрываем скроллы */
        * { 
            margin: 0 !important; 
            padding: 0 !important; 
            box-sizing: border-box !important; 
        }
        
        html, body { 
            width: 100%; 
            height: 100%; 
            background: transparent; 
            overflow: hidden; 
        }
        
        #examBtn {
            display: block;
            width: 100%;
            height: 100%;
            border: none !important;
            background: transparent !important;
            cursor: pointer;
            outline: none;
            
            /* Намертво прижимаем картинку к верхнему краю (top) без искажения пропорций */
            background-image: url('https://raw.githubusercontent.com/ogaydv-prog/Simulator-NPV/main/pic-exam-final.png');
            background-size: contain; /* Картинка сжимается/расширяется чисто по ширине ячейки */
            background-position: top center; /* Намертво держит верх без зазоров */
            background-repeat: no-repeat;
            
            transition: filter 0.2s ease-in-out;
        }
        
        /* Равномерная и аккуратная подсветка всей картинки при наведении */
        #examBtn:hover { 
            filter: brightness(1.12) drop-shadow(0 0 12px rgba(99, 102, 241, 0.6)); 
        }
    </style>
</head>
<body>

    <button id="examBtn" onclick="window.open('exam-dashbord-pro-f.html', '_blank')"></button>

</body>
</html>
</html>
