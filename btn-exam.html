<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Полный обнуляющий сброс */
        * { margin: 0 !important; padding: 0 !important; box-sizing: border-box !important; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        
        #examBtn {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            border: none !important;
            background: transparent !important;
            transition: transform 0.2s;
        }
        
        #examBtn:hover { transform: scale(1.005); filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5)); }
        
        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Картинка заполнит ширину, сохраняя пропорции */
            vertical-align: top; /* Убирает отступ снизу */
        }
    </style>
</head>
<body>

    <button id="examBtn" onclick="window.open('exam-dashbord-pro-f.html', '_blank')">
        <img src="https://raw.githubusercontent.com/ogaydv-prog/Simulator-NPV/main/pic-exam-final.png" alt="Экзамен">
    </button>

</body>
</html>
