<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0 !important; padding: 0 !important; box-sizing: border-box !important; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        
        #examBtn {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            border: none !important;
            background: transparent !important;
            padding: 0 !important;
            margin: 0 !important;
            line-height: 0;
            overflow: hidden; /* Гарантирует, что ничего не вылезет */
        }
        
        /* Вместо внешней тени — только внутреннее свечение и яркость */
        #examBtn:hover { 
            filter: brightness(1.15); 
            box-shadow: inset 0 0 0 4px rgba(99, 102, 241, 0.6); 
        }
        
        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: fill; 
            vertical-align: top;
        }
    </style>
</head>
<body>

    <button id="examBtn" onclick="window.open('exam-dashbord-pro-f.html', '_blank')">
        <img src="https://raw.githubusercontent.com/ogaydv-prog/Simulator-NPV/main/pic-exam-final.png" alt="Экзамен">
    </button>

</body>
</html>
