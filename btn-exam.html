<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        /* Полный сброс всех отступов и полей браузера */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden; /* Полностью исключает появление полос прокрутки */
        }

        /* Контейнер жестко прижимает контент к верхнему краю */
        .wrapper {
            display: block;
            width: 100%;
            margin: 0 !important;
            padding: 0 !important;
        }

        #examBtn {
            display: block;
            width: 100%;
            border: none !important;
            background: transparent !important;
            padding: 0 !important;
            margin: 0 !important;
            outline: none;
            cursor: pointer;
        }

        #examBtn img {
            display: block;
            width: 100%;
            height: auto; /* Высота подстраивается автоматически, сохраняя пропорции картинки */
            border: none !important;
            margin: 0 !important;
            padding: 0 !important;
            vertical-align: top; /* Картинка намертво прилипает к верхнему краю фрейма */
            transition: filter 0.2s ease;
        }

        /* Аккуратный эффект подсветки при наведении без изменения геометрии */
        #examBtn:hover img {
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <button id="examBtn" onclick="window.open('exam-dashbord-pro-f.html', '_blank')">
            <img src="https://raw.githubusercontent.com/ogaydv-prog/Simulator-NPV/main/pic-exam-final.png" alt="Экзамен">
        </button>
    </div>

</body>
</html>
