<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }
        /* Ссылка занимает 100% пространства фрейма */
        a {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        /* Картинка прижата ко всем краям */
        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Картинка будет видна целиком без обрезки */
            border: none;
        }
    </style>
</head>
<body>
    <a href="exam-dashbord-pro-f.html" target="_blank">
        <img src="https://raw.githubusercontent.com/ogaydv-prog/Simulator-NPV/main/pic-exam-final.png" alt="Экзамен">
    </a>
</body>
</html>
