<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; }
        body { background: transparent; display: flex; justify-content: center; align-items: flex-start; }
        
        #examBtn {
            display: block;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            margin: 0;
            /* Кнопка будет ровно такого размера, какая картинка */
            width: auto; 
            height: auto;
        }
        
        img {
            display: block;
            /* Картинка не будет сжиматься */
            max-width: 100%;
            height: auto;
            border: none;
        }

        #examBtn:hover { filter: brightness(1.1); }
    </style>
</head>
<body>

    <button id="examBtn" onclick="window.open('exam-dashbord-pro-f.html', '_blank')">
        <img src="https://raw.githubusercontent.com/ogaydv-prog/Simulator-NPV/main/pic-exam-final.png" alt="Экзамен">
    </button>

</body>
</html>
</html>
